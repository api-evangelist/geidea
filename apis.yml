aid: geidea
url: https://raw.githubusercontent.com/api-evangelist/geidea/refs/heads/main/apis.yml
name: Geidea
kind: company
description: Geidea is a Saudi-headquartered fintech and payments platform serving
  merchants across the MENA region (Saudi Arabia, Egypt, and the UAE). Its Payment
  Gateway lets merchants accept card and wallet payments through a hosted Geidea
  Checkout (HPP) page or a server-to-server Direct API for PCI-DSS-compliant
  merchants, covering the full transaction lifecycle - create session, 3-D Secure
  authentication, pay, capture, void, refund, cancel, tokenization, Pay by Link,
  and Pay by Invoice - with support for mada, Visa, Mastercard, Apple Pay, Google
  Pay, Meeza QR, and BNPL. Payments are authenticated with a merchant public key
  and API password over HTTP Basic auth plus an HMAC request signature, and
  results are delivered back to merchants via webhook (callback) notifications.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Gateway
- Saudi Arabia
- Egypt
- MENA
- mada
- Cards
- POS
- Checkout
- Fintech
