- aid: geidea:geidea-pay-by-link-api
  name: Geidea Pay by Link API
  tags:
  - Pay by Link
  - Payment Links
  - Invoicing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.geidea.net/docs/pay-by-link-apis
  baseURL: https://api.merchant.geidea.net
  properties:
  - url: https://docs.geidea.net/docs/pay-by-link-apis
    type: Documentation
  - url: https://docs.geidea.net/reference/create-payment-link
    type: APIReference
  description: >-
    Programmatically create, update, fetch, delete, and send (by email or SMS) shareable payment links
    so customers can pay without a full storefront integration. Available for Egypt and the UAE. Exact
    request paths are documented in the Geidea API reference; endpoint schemas are not modeled in the
    OpenAPI in this repository.
