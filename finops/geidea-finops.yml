meters:
- name: transaction_discount_rate
  description: Per-transaction Merchant Discount Rate charged on processed payment value.
  unit: percent_of_value
  aggregation: sum
  dimensions:
  - merchant
  - region
  - scheme
  - method
- name: fixed_transaction_fee
  description: Fixed per-transaction fee, where applicable, per successful payment.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - method
- name: refund_chargeback_fee
  description: Fees associated with refunds and chargebacks, where applicable.
  unit: events
  aggregation: sum
  dimensions:
  - merchant
principles:
- name: Visibility
  description: Track processed volume, MDR, and fixed fees by region, scheme, and payment method to understand effective cost of acceptance.
- name: Allocation
  description: Tag transactions with a merchantReferenceId that maps to product line or channel so acquiring cost allocates to the right cost center.
- name: Optimization
  description: Route to lower-cost schemes and methods where possible (for example mada or Meeza QR), minimize refunds and chargebacks, and renegotiate MDR as volume grows.
- name: Accountability
  description: Reconcile the Geidea settlement statements monthly against processed transactions and expected MDR.
