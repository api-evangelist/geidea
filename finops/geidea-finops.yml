description: >-
  FinOps view of Geidea Payment Gateway spend. Unlike a metered developer API,
  Geidea's cost model is transactional acquiring: the merchant pays a per-transaction
  Merchant Discount Rate (MDR), plus any fixed per-transaction and settlement fees,
  on payments processed through Checkout, the Direct API, Pay by Link, and Pay by
  Invoice. Rates are negotiated per merchant and vary by volume, region (KSA, Egypt,
  UAE), card scheme (mada, Visa, Mastercard), and payment method (cards, wallets,
  Meeza QR, BNPL). There is no separate metered charge for calling the API; the unit
  of cost is the payment transaction and its value.
notes: >-
  Per-transaction rates are commercial and not reconciled here. The dominant cost
  driver is processed payment volume and mix, not API request count. Reconcile MDR,
  fixed fees, chargeback fees, and settlement timing against your Geidea merchant
  agreement.
